name: 构建多平台程序 (Electron & Android)

# 只由 tag 触发:挂 main push 会让每个提交都留下一个 release
# main 的闸门(类型检查 + ESLint + 单测)在 deploy.yml
on:
  push:
    tags:
      - 'v*.*.*'
  # 手动触发:不打 tag 也能出 APK/Electron 产物(仅 artifact,不发 Release)
  workflow_dispatch:

# 同一 tag 串行:并发 run 会在 release job 互删对方刚传的资产
# cancel-in-progress 须为 false:取消可能落在「已删完、还没传完」的窗口,留下资产不全的 Release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本闸门:tag 须与 package.json 一致(APK 的 versionName/versionCode 由 android/app/build.gradle 从 package.json 读)
  guard:
    name: 版本闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 校验 tag 与 package.json 版本一致
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "手动触发(非 tag),跳过版本闸门"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag = $TAG · package.json = $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag($TAG)与 package.json 的版本($PKG)不一致 —— 先把 package.json 的版本提上去再打 tag"
            exit 1
          fi

  build-electron:
    name: 构建 Electron (${{ matrix.os }})
    needs: [guard]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 静态检查 + 单元测试
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test:report

      - name: 缓存 Electron Builder
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: 构建 Electron
        run: bun run build:electron --${{ matrix.platform }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 增量包 yunyin-<ver>-win-update.zip:只含 resources/app,解压到安装目录(与 云隐修仙录.exe 同级)覆盖;
      #   前提是 Electron 运行时版本没变,升 electron 依赖的那一版发布说明须提醒下完整包
      # Web 包 yunyin-<ver>-web.zip:dist/ 的内容,解压即站点根
      # tar 是 Windows 自带的 bsdtar(System32\tar.exe),-a 按 .zip 后缀选格式
      - name: 打增量包与 Web 包
        shell: bash
        run: |
          VER=$(bun -e "console.log(require('./package.json').version)")
          TAR=/c/Windows/System32/tar.exe
          "$TAR" -a -cf "pkg/yunyin-$VER-win-update.zip" -C pkg/win-unpacked resources/app
          "$TAR" -a -cf "pkg/yunyin-$VER-web.zip" -C dist $(cd dist && ls -A)
          ls -la pkg/*.zip

      # 完整包 + 增量包 + Web 包
      - name: 上传 Electron 安装包
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            pkg/*.zip

  build-android:
    name: 构建 Android APK
    needs: [guard]
    runs-on: ubuntu-latest
    # 签名读仓库内 android/keystore.properties(含口令)+ release.keystore,CI 无 Secret —— 仓库所有者的既定选择
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 静态检查 + 单元测试
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test:report

      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 构建前端
        run: bun run build
        env:
          # APK 内写死后端地址:默认 https://yxxx.071717.xyz;
          # 仓库 Variable VITE_API_BASE(Settings → Secrets and variables → Actions → Variables)可覆盖
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://yxxx.071717.xyz' }}

      - name: 同步 Capacitor
        run: bunx cap sync android

      - name: 构建 APK (Release)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  release:
    # 只在 tag 触发时发 Release;手动触发产物留在 artifact
    if: github.ref_type == 'tag'
    needs: [guard, build-electron, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 获取版本号
        id: get_version
        # tag 即版本(闸门已校验与 package.json 一致)
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # 不用 merge-multiple,防止覆盖冲突
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./raw-assets

      - name: 整理并重命名产物
        run: |
          mkdir -p ./final-release

          find ./raw-assets/electron-* -type f -name "*.zip" -exec cp {} ./final-release/ \;

          find ./raw-assets/android-apk -type f -name "*.apk" -exec cp {} ./final-release/ \; || true

          echo "Final assets to upload:"
          ls -R ./final-release

      - name: 删除已有 Release 资产
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          gh release view "$VERSION" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
            echo "Deleting asset: $asset"
            gh release delete-asset "$VERSION" "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 小节标题形如 `## [1.41.0] …`
      - name: 生成 Release 说明(取 CHANGELOG 该版本小节)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="[$VER]" 'BEGIN{in_sec=0} /^## \[/{ if(in_sec) exit; if(index($0,v)==4) in_sec=1; next } in_sec{print}' CHANGELOG.md > "$GITHUB_WORKSPACE/.release-body.md"
          if [ ! -s "$GITHUB_WORKSPACE/.release-body.md" ]; then
            echo "::warning::CHANGELOG.md 里找不到 `## [$VER]` 小节,Release 备注将为空"
          else
            echo "已从 CHANGELOG 提取 [$VER] 小节,共 $(wc -l < "$GITHUB_WORKSPACE/.release-body.md") 行"
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: .release-body.md
          files: ./final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
