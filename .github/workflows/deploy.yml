name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 静态检查 + 单元测试
        run: |
          bun run check
          bun run test:report
      - name: 构建
        run: bun run build
      # 前置:Settings → Pages → Build and deployment 的 Source 须为 GitHub Actions,否则 configure-pages 报 Not Found
      # 不用 enablement: true 绕过:它要求非 GITHUB_TOKEN 的凭据(PAT 的 repo 权限或 GitHub App 的 administration:write + pages:write)
      - name: 配置 Pages
        uses: actions/configure-pages@v6
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v5
