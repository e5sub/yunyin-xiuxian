name: 历史线性校验

# 线性历史护栏(可见层)。权威闸门是规则集的「Require a linear history」:合并前检查看不到合并时生成的节点
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  history-linear:
    # 作业名即状态检查名
    name: 历史线性校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # base..head 的 merge 提交与祖先关系需全量历史
          fetch-depth: 0
      - name: 校验 PR 内无 merge 提交
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          merges=$(git rev-list --merges "$BASE..$HEAD")
          if [ -n "$merges" ]; then
            cnt=$(printf '%s\n' "$merges" | wc -l)
            echo "::error:: 本 PR 提交范围内检测到 ${cnt} 个 merge 提交。请改用 rebase 同步主干(rebase 而非「Merge main」),保持历史线性。"
            printf '%s\n' "$merges"
            exit 1
          fi
          echo "✓ 本 PR 提交范围内无 merge 提交"
      - name: 校验 base 是 head 的祖先(fast-forward 可合并)
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if ! git merge-base --is-ancestor "$BASE" "$HEAD"; then
            echo "::error:: 目标主干($BASE)不是本分支($HEAD)的祖先:分支已落后/分叉于主干,无法 fast-forward 合并。请先 rebase 到最新 main 再推送。"
            exit 1
          fi
          echo "✓ base 是 head 的祖先,分支可 fast-forward 合并"
