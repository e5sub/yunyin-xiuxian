services:
  yunyin-xiuxian:
    build:
      context: .
      dockerfile: Dockerfile
    image: yunyin-xiuxian:latest
    container_name: yunyin-xiuxian
    ports:
      # 内外端口一致:由根目录 .env 的 PORT 决定(compose 自动插值),默认 8787
      # 想换端口只需在 .env 里改 PORT=xxxx,不用动这里
      - "${PORT:-8787}:${PORT:-8787}"
    restart: unless-stopped
    networks:
      - yunyin-net
    # 配置统一放项目根目录 .env(即 server/.env.example 的内容复制过来):
    # compose 读它做端口等插值,并整体注入容器。旧的 server/.env 仍兼容(优先级更低)
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - TZ=Asia/Shanghai
      # 其余配置(PORT/GM_PATH/DB_DRIVER/SMTP_* 等)全走 .env,这里不再写死以免覆盖
    volumes:
      # JWT 密钥(jwt-secret)恒存这里:即使换 MySQL 也【不要】去掉本卷——
      # 不挂卷则每次重启密钥重新生成,全员被踢回登录页。或者改为在 .env 配 YUNYIN_JWT_SECRET
      - yunyin-data:/app/server/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yunyin-data:

networks:
  yunyin-net:
    driver: bridge
