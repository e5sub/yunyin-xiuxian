services:
  yunyin-xiuxian:
    build:
      context: .
      dockerfile: Dockerfile
    image: yunyin-xiuxian:latest
    container_name: yunyin-xiuxian
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - yunyin-net
    # 宿主机 server/.env 里的全部配置(端口/GM 路径/数据库/SMTP 等)注入容器;
    # compose v2.24+ 支持 required:false,文件不存在时忽略此行
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - TZ=Asia/Shanghai
      # GM 后台路径(可自定义;改后重启生效)
      - GM_PATH=/gm
      # sqlite(默认) | mysql;mysql 时再配 DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME
      - DB_DRIVER=sqlite
      # 邮件(可选):EMAIL_ENABLED=true + SMTP_* 实发验证码;EMAIL_CODE_REQUIRED=true 强制注册验证码
      # - EMAIL_ENABLED=false
      # - EMAIL_CODE_REQUIRED=false
      # - SMTP_HOST=
      # - SMTP_PORT=465
      # - SMTP_USER=
      # - SMTP_PASS=
      # - SMTP_FROM=
    volumes:
      # 账号/云存档/聊天等数据(SQLite 库 + JWT 密钥);换 MySQL 可去掉
      - yunyin-data:/app/server/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yunyin-data:

networks:
  yunyin-net:
    driver: bridge
