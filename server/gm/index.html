<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>云隐修仙录 · GM 后台</title>
<style>
  /* 配色与游戏内一致(见 src/style.css):宣纸底 + 墨色字 + 朱砂点睛;暗色跟随系统 */
  :root {
    color-scheme: light dark;
    --c-paper: 243 239 228;
    --c-paper-deep: 234 228 211;
    --c-paper-lift: 244 240 230;
    --c-ink: 41 39 34;
    --c-ink-soft: 74 70 61;
    --c-ink-faint: 104 99 88;
    --c-cinnabar: 168 63 57;
    --c-cinnabar-deep: 140 51 46;
    --c-jade: 80 109 88;
    --c-gold: 124 94 42;

    --bg: rgb(var(--c-paper));
    --card: rgb(var(--c-paper-lift));
    --ink: rgb(var(--c-ink));
    --ink-2: rgb(var(--c-ink-soft));
    --sub: rgb(var(--c-ink-faint));
    --line: rgb(var(--c-ink) / 0.15);
    --brand: rgb(var(--c-cinnabar));
    --brand-deep: rgb(var(--c-cinnabar-deep));
    --danger: rgb(var(--c-cinnabar-deep));
    --ok: rgb(var(--c-jade));
    --warn: rgb(var(--c-gold));
    --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-kai: 'LXGW WenKai GB Screen', 'Kaiti SC', 'STKaiti', KaiTi, 'Noto Serif SC', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-paper: 33 31 28;
      --c-paper-deep: 41 38 34;
      --c-paper-lift: 51 49 46;
      --c-ink: 232 226 210;
      --c-ink-soft: 198 191 169;
      --c-ink-faint: 168 161 140;
      --c-cinnabar: 201 85 78;
      --c-cinnabar-deep: 163 70 64;
      --c-jade: 147 175 149;
      --c-gold: 200 163 90;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:var(--font-sans);
    background:radial-gradient(130% 90% at 50% 0%, rgb(var(--c-paper-lift)) 0%, rgb(var(--c-paper)) 64%) fixed;
    color:var(--ink);
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  header { position:sticky; top:0; z-index:5; height:56px; display:flex; align-items:center; gap:14px;
    padding:0 20px; background:rgb(var(--c-paper) / 0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); }
  header h1 { font-family:var(--font-kai); font-size:17px; font-weight:600; letter-spacing:.08em; }
  header .spacer { flex:1; }
  header .who { color:var(--sub); font-size:12px; letter-spacing:.06em; }
  button { cursor:pointer; font-family:var(--font-kai); font-size:13px; color:var(--ink); letter-spacing:.04em;
    background:var(--card); border:1px solid rgb(var(--c-ink) / 0.22); border-radius:8px; padding:6px 13px;
    transition:border-color .15s, color .15s, background .15s; }
  button:hover { border-color:rgb(var(--c-cinnabar) / 0.55); color:var(--brand); }
  button.danger { color:var(--danger); border-color:rgb(var(--c-cinnabar) / 0.35); }
  button.danger:hover { background:rgb(var(--c-cinnabar) / 0.10); border-color:var(--danger); }
  button.primary { background:var(--brand); border-color:var(--brand); color:rgb(var(--c-paper)); }
  button.primary:hover { background:var(--brand-deep); border-color:var(--brand-deep); color:rgb(var(--c-paper)); }
  input, select, textarea { font-family:inherit; font-size:13px; color:var(--ink); background:var(--card);
    border:1px solid rgb(var(--c-ink) / 0.20); border-radius:8px; padding:7px 10px; outline:none; }
  input::placeholder, textarea::placeholder { color:var(--sub); }
  input:focus, select:focus, textarea:focus { border-color:rgb(var(--c-cinnabar) / 0.6); box-shadow:0 0 0 3px rgb(var(--c-cinnabar) / 0.08); }
  main { max-width:1120px; margin:0 auto; padding:22px 20px 44px; }
  .tabs { display:inline-flex; gap:4px; margin-bottom:18px; background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:4px; }
  .tabs button { border:none; background:transparent; padding:7px 18px; border-radius:7px; color:var(--sub); }
  .tabs button:hover { color:var(--brand); }
  .tabs button.on { background:var(--brand); color:rgb(var(--c-paper)); }
  .tabs button.on:hover { color:rgb(var(--c-paper)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px;
    margin-bottom:16px; box-shadow:0 1px 2px rgb(var(--c-ink) / 0.05); }
  .card h2 { font-family:var(--font-kai); font-size:14px; font-weight:600; letter-spacing:.08em; margin-bottom:12px; }
  .card h2::before { content:''; display:inline-block; width:3px; height:13px; background:var(--brand);
    border-radius:2px; margin-right:8px; vertical-align:-1px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid rgb(var(--c-ink) / 0.10);
    font-size:13px; white-space:nowrap; }
  th { color:var(--sub); font-weight:500; font-family:var(--font-kai); letter-spacing:.06em;
    background:rgb(var(--c-ink) / 0.04); }
  td { color:var(--ink-2); }
  tbody tr:hover td { background:rgb(var(--c-cinnabar) / 0.045); }
  td.wrap { white-space:normal; }
  .tag { display:inline-block; padding:1px 8px; border-radius:6px; font-size:12px; border:1px solid transparent; }
  .tag.ok { background:rgb(var(--c-jade) / 0.14); color:var(--ok); border-color:rgb(var(--c-jade) / 0.30); }
  .tag.ban { background:rgb(var(--c-cinnabar) / 0.12); color:var(--danger); border-color:rgb(var(--c-cinnabar) / 0.32); }
  .tag.admin { background:rgb(var(--c-gold) / 0.14); color:var(--warn); border-color:rgb(var(--c-gold) / 0.32); }
  .stat-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .stat span { color:var(--sub); font-size:12px; letter-spacing:.08em; }
  .stat b { display:block; font-family:var(--font-kai); font-size:24px; line-height:1.35; margin-top:2px; }
  .stat.hot b { color:var(--brand); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--sub); font-size:12px; }
  .pager { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:9;
    background:rgb(var(--c-ink)); color:rgb(var(--c-paper)); padding:9px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:.25s; pointer-events:none; box-shadow:0 8px 24px rgb(0 0 0 / .18); }
  .toast.show { opacity:1; }
  dialog { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px;
    padding:20px 22px; min-width:360px; max-width:540px; box-shadow:0 18px 50px rgb(0 0 0 / .25); }
  dialog::backdrop { background:rgb(20 18 15 / .45); backdrop-filter:blur(2px); }
  dialog h3 { font-family:var(--font-kai); font-size:15px; letter-spacing:.08em; margin-bottom:14px; }
  dialog .field { margin-bottom:12px; }
  dialog label { display:block; font-size:12px; color:var(--sub); margin-bottom:4px; }
  dialog input, dialog textarea { width:100%; }
  dialog textarea { resize:vertical; }
  dialog .acts { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .cfg-grid { display:grid; grid-template-columns:1fr auto auto; gap:10px 12px; align-items:center; }
  .cfg-grid input { max-width:420px; }
  .cfg-group { grid-column:1/-1; margin-top:8px; font-family:var(--font-kai); font-weight:600;
    letter-spacing:.08em; color:var(--brand); }
  .kv { font-size:13px; line-height:1.9; }
  .kv b { display:inline-block; min-width:84px; color:var(--sub); font-weight:400; }
  .login-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
  .login-box { width:352px; padding:34px 32px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 16px 40px rgb(var(--c-ink) / 0.08); }
  .login-box h1 { font-family:var(--font-kai); font-size:24px; font-weight:600; letter-spacing:.18em; }
  .login-box h1::after { content:''; display:block; width:38px; height:3px; border-radius:2px;
    background:var(--brand); margin:12px 0 0; }
  .login-box .muted { margin:10px 0 22px; letter-spacing:.12em; }
  .login-box input { width:100%; margin-bottom:12px; }
  .login-box button.primary { width:100%; padding:9px; font-size:14px; letter-spacing:.3em; }
  @media (max-width: 720px) {
    main { padding:16px 12px 32px; }
    .stat-grid { grid-template-columns:repeat(2,1fr); }
    header { padding:0 14px; }
    header h1 { font-size:15px; }
    dialog { min-width:0; width:calc(100vw - 32px); }
  }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-box">
    <h1>云隐修仙录</h1>
    <div class="muted">GM 后台 · 管理员登录</div>
    <input id="lg-user" placeholder="道号" autocomplete="username">
    <input id="lg-pass" type="password" placeholder="口令" autocomplete="current-password">
    <button class="primary" style="width:100%" onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>云隐修仙录 · GM 后台</h1>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button onclick="logout()">退出</button>
  </header>
  <main>
    <div class="tabs">
      <button id="tab-stats" class="on" onclick="switchTab('stats')">概览</button>
      <button id="tab-users" onclick="switchTab('users')">账号管理</button>
      <button id="tab-config" onclick="switchTab('config')">参数设置</button>
      <button id="tab-broadcast" onclick="switchTab('broadcast')">全服公告</button>
    </div>

    <section id="pane-stats">
      <div class="stat-grid" id="stats"></div>
    </section>

    <section id="pane-users" class="hidden">
      <div class="card">
        <div class="row">
          <input id="u-search" placeholder="搜道号 / 邮箱" style="width:220px" onkeydown="if(event.key==='Enter')loadUsers(1)">
          <button class="primary" onclick="loadUsers(1)">搜索</button>
          <span class="muted" id="u-total"></span>
        </div>
      </div>
      <div class="card">
        <table>
          <thead><tr>
            <th>ID</th><th>道号</th><th>邮箱</th><th>角色名</th><th>境界</th><th>战力</th>
            <th>身份</th><th>状态</th><th>存档更新</th><th style="width:230px">操作</th>
          </tr></thead>
          <tbody id="u-rows"></tbody>
        </table>
        <div class="pager">
          <button onclick="pageTurn(-1)">上一页</button>
          <span class="muted" id="u-page"></span>
          <button onclick="pageTurn(1)">下一页</button>
        </div>
      </div>
    </section>

    <section id="pane-config" class="hidden">
      <div class="card">
        <h2>游戏关键参数</h2>
        <div class="cfg-grid" id="cfg-rows"></div>
        <div class="row" style="margin-top:14px">
          <button onclick="sendTestMail()">发送测试邮件</button>
          <span class="muted">填好 SMTP 后发一封验证;改后立即生效(邮箱开关最迟 30 秒)</span>
        </div>
      </div>
    </section>

    <section id="pane-broadcast" class="hidden">
      <div class="card">
        <h2>全服公告</h2>
        <textarea id="bc-text" rows="3" maxlength="200" placeholder="将同步到全服聊天(署名「仙官」)与公告参数"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="primary" onclick="sendBroadcast()">发布公告</button>
          <span class="muted">历史公告见「参数设置」页 announcement 字段</span>
        </div>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg-pw">
  <h3>重置口令</h3>
  <div class="field"><label>新口令(6~64 字)</label><input id="pw-input" type="password" autocomplete="new-password"></div>
  <div class="acts">
    <button onclick="document.getElementById('dlg-pw').close()">取消</button>
    <button class="primary" onclick="confirmPw()">确定</button>
  </div>
</dialog>

<dialog id="dlg-detail">
  <h3 id="dt-title">用户详情</h3>
  <div id="dt-body" class="kv"></div>
  <div class="acts"><button onclick="document.getElementById('dlg-detail').close()">关闭</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const API = location.pathname.replace(/\/+$/, '') + '/api'
let token = sessionStorage.getItem('gm_token') || ''
let me = sessionStorage.getItem('gm_name') || ''
let page = 1, pageSize = 20

function $ (id) { return document.getElementById(id) }
function toast (msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200) }
function esc (s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function fmt (ts) { return ts ? new Date(Number(ts)).toLocaleString('zh-CN', { hour12: false }) : '—' }

async function api (path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: token ? 'Bearer ' + token : '', ...(opts.headers || {}) }
  })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status))
  return data
}

function switchTab (name) {
  for (const t of ['stats', 'users', 'config', 'broadcast']) {
    $('tab-' + t).classList.toggle('on', t === name)
    $('pane-' + t).classList.toggle('hidden', t !== name)
  }
  if (name === 'stats') loadStats()
  if (name === 'users') loadUsers(page)
  if (name === 'config') loadConfig()
}

async function doLogin () {
  try {
    const d = await api('/login', { method: 'POST', body: JSON.stringify({ username: $('lg-user').value.trim(), password: $('lg-pass').value }) })
    token = d.token
    me = $('lg-user').value.trim()
    sessionStorage.setItem('gm_token', token)
    sessionStorage.setItem('gm_name', me)
    enter()
  } catch (e) { toast(e.message) }
}
function logout () { token = ''; sessionStorage.clear(); location.reload() }

function enter () {
  $('login').classList.add('hidden')
  $('app').classList.remove('hidden')
  $('who').textContent = '管理员:' + me
  loadStats()
}

async function loadStats () {
  try {
    const d = await api('/stats')
    $('stats').innerHTML = [
      ['注册用户', d.users], ['有效存档', d.saves], ['已建角色', d.profiles],
      ['当前在线', d.online], ['封禁中', d.banned]
    ].map(([k, v]) => `<div class="stat${k === '当前在线' ? ' hot' : ''}"><span>${k}</span><b>${v}</b></div>`).join('')
  } catch (e) { toast(e.message) }
}

async function loadUsers (p) {
  page = p || page
  try {
    const q = new URLSearchParams({ search: $('u-search').value.trim(), page, pageSize })
    const d = await api('/users?' + q)
    $('u-total').textContent = '共 ' + d.total + ' 人'
    $('u-page').textContent = '第 ' + d.page + ' / ' + Math.max(Math.ceil(d.total / d.pageSize), 1) + ' 页'
    $('u-rows').innerHTML = d.users.map(u => `<tr>
      <td>${u.id}</td>
      <td>${esc(u.username)}</td>
      <td class="wrap">${esc(u.email || '—')}</td>
      <td>${u.profile ? esc(u.profile.name) : '—'}</td>
      <td>${u.profile ? esc(u.profile.realmLabel) : '—'}</td>
      <td>${u.profile ? esc(u.profile.powerE > 0 ? (u.profile.powerM + 'e' + u.profile.powerE) : u.profile.powerM) : '—'}</td>
      <td>${u.role === 'admin' ? '<span class="tag admin">管理员</span>' : '玩家'}</td>
      <td>${u.status === 'active' ? '<span class="tag ok">正常</span>' : '<span class="tag ban">封禁</span>'}</td>
      <td>${fmt(u.saveAt)}</td>
      <td>
        <button onclick="viewDetail(${u.id})">详情</button>
        ${u.status === 'active'
          ? `<button class="danger" onclick="ban(${u.id},true)">封禁</button>`
          : `<button onclick="ban(${u.id},false)">解封</button>`}
        <button onclick="resetPw(${u.id})">重置口令</button>
        ${u.role !== 'admin' ? `<button class="danger" data-del-id="${u.id}" data-del-name="${esc(u.username)}">删除</button>` : ''}
      </td>
    </tr>`).join('') || '<tr><td colspan="10" class="muted">无数据</td></tr>'
  } catch (e) { toast(e.message) }
}
function pageTurn (d) { loadUsers(Math.max(page + d, 1)) }

async function ban (id, on) {
  try { await api(`/users/${id}/${on ? 'ban' : 'unban'}`, { method: 'POST' }); toast(on ? '已封禁' : '已解封'); loadUsers() }
  catch (e) { toast(e.message) }
}
async function delUser (id, name) {
  if (!confirm(`删除用户「${name}」?\n其存档、角色、好友、聊天记录将一并清除,不可恢复。`)) return
  try { await api(`/users/${id}`, { method: 'DELETE' }); toast('已删除'); loadUsers() }
  catch (e) { toast(e.message) }
}
let pwTarget = 0
function resetPw (id) { pwTarget = id; $('pw-input').value = ''; $('dlg-pw').showModal() }
async function confirmPw () {
  try { await api(`/users/${pwTarget}/reset-password`, { method: 'POST', body: JSON.stringify({ password: $('pw-input').value }) }); $('dlg-pw').close(); toast('口令已重置') }
  catch (e) { toast(e.message) }
}
async function viewDetail (id) {
  try {
    const d = await api(`/users/${id}`)
    const u = d.user, p = d.profile
    $('dt-title').textContent = `用户详情 · ${u.username} (id=${u.id})`
    $('dt-body').innerHTML = `
      <div><b>邮箱</b>${esc(u.email || '—')}</div>
      <div><b>身份</b>${u.role === 'admin' ? '管理员' : '玩家'} · ${u.status === 'active' ? '正常' : '封禁'}</div>
      <div><b>注册时间</b>${fmt(u.created_at)}</div>
      <div><b>角色名</b>${p ? esc(p.name) : '—'}</div>
      <div><b>境界</b>${p ? esc(p.realm_label) + ' (' + p.realm_index + ')' : '—'}</div>
      <div><b>战力</b>${p ? p.power_m + (p.power_e > 0 ? 'e' + p.power_e : '') : '—'}</div>
      <div><b>气血</b>${p ? p.hp_m + (p.hp_e > 0 ? 'e' + p.hp_e : '') : '—'} <b style="min-width:0">攻击</b>${p ? p.atk_m + (p.atk_e > 0 ? 'e' + p.atk_e : '') : '—'}</div>
      <div><b>角色更新</b>${p ? fmt(p.updated_at) : '—'}</div>
      <div><b>存档</b>${d.save ? `版本 ${d.save.version} · ${d.save.bytes} 字节 · ${fmt(d.save.updatedAt)}` : '无'}</div>
      <div><b>好友数</b>${d.friends}</div>`
    $('dlg-detail').showModal()
  } catch (e) { toast(e.message) }
}

const CFG_GROUPS = [
  {
    title: '基础参数',
    keys: {
      announcement: ['全服公告', 'text'],
      chat_min_interval_ms: ['聊天最小间隔(毫秒)', 'num'],
      chat_max_len: ['单条聊天最长字数', 'num'],
      leaderboard_size: ['排行榜条数', 'num'],
      chat_history_size: ['聊天历史条数', 'num'],
      chat_retention_days: ['聊天留存天数(超期自动清理)', 'num']
    }
  },
  {
    title: '副本 · 万妖围城',
    keys: {
      boss_daily_attempts: ['每日出剑次数', 'num'],
      boss_hp_atk_mult: ['血池=全服最高攻×N', 'num'],
      boss_strike_rounds: ['出剑模拟回合数', 'num'],
      boss_respawn_sec: ['击杀后重生秒数', 'num'],
      boss_reward_stone: ['奖励灵石数', 'num'],
      boss_reward_herb: ['奖励灵草数', 'num']
    }
  },
  {
    title: '副本 · 心魔镜像',
    keys: {
      demon_daily_attempts: ['每日次数', 'num'],
      demon_hp_base: ['心魔血=最高攻×N×人数^0.8', 'num'],
      demon_atk_mult: ['心魔攻=最高攻×值%(60=0.6倍)', 'num'],
      demon_reward_stone: ['胜局灵石基数', 'num'],
      demon_reward_herb: ['胜局灵草基数', 'num']
    }
  },
  {
    title: '副本 · 秘境共探',
    keys: {
      explore_daily_attempts: ['每日次数', 'num'],
      explore_nodes: ['秘境节点数', 'num'],
      explore_reward_stone: ['灵石基数', 'num'],
      explore_reward_herb: ['灵草基数', 'num']
    }
  },
  {
    title: '副本 · 洞天守卫',
    keys: {
      guard_daily_attempts: ['每日次数', 'num'],
      guard_max_waves: ['妖潮波数上限', 'num'],
      guard_reward_stone: ['每波灵石', 'num'],
      guard_reward_herb: ['每波灵草', 'num']
    }
  },
  {

async function loadConfig () {
  try {
    const d = await api('/config')
    $('cfg-rows').innerHTML = CFG_GROUPS.map(g => `
      <div class="cfg-group">${g.title}</div>
      ${Object.keys(g.keys).map(k => `
        <label style="color:var(--sub);font-size:13px">${g.keys[k][0]}</label>
        <input id="cfg-${k}" value="${esc(d.config[k] ?? '')}">
        <button class="primary" onclick="saveCfg('${k}')">保存</button>`).join('')}`).join('')
  } catch (e) { toast(e.message) }
}
async function saveCfg (k) {
  try { await api(`/config/${k}`, { method: 'PUT', body: JSON.stringify({ value: $('cfg-' + k).value }) }); toast('已保存') }
  catch (e) { toast(e.message) }
}
async function sendTestMail () {
  const email = prompt('收件邮箱(留空则发给你的账号注册邮箱):', '') || ''
  try {
    const d = await api('/email-test', { method: 'POST', body: JSON.stringify({ email }) })
    toast('测试邮件已发送 -> ' + d.to)
  } catch (e) { toast(e.message) }
}
async function sendBroadcast () {
  try { await api('/broadcast', { method: 'POST', body: JSON.stringify({ content: $('bc-text').value.trim() }) }); toast('公告已发布'); $('bc-text').value = '' }
  catch (e) { toast(e.message) }
}

// 删除按钮走事件委托:道号不拼进 onclick 字符串,避免引号把 HTML 属性顶穿
$('u-rows').addEventListener('click', e => {
  const btn = e.target.closest('button[data-del-id]')
  if (!btn) return
  void delUser(Number(btn.dataset.delId), btn.dataset.delName || '')
})
