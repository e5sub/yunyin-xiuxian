server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss
               application/json image/svg+xml;

    # history 模式回退:项目用 hash 路由,保留兜底
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 若另配 CSP:开人机验证(Turnstile)的站必须放行 challenges.cloudflare.com ——
    # 脚本走 script-src、挂件 iframe 走 frame-src,少一条登录页就报「人机验证被站点安全策略拦下」。
    # 注意:用官方镜像(STATIC_DIR)时这段头由后端进程自己发且已放行;此处的 CSP 与后端那条各自
    # 独立生效(取交集),所以这里只要写了,同样得把两域补齐。
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'" always;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
