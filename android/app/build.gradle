apply plugin: 'com.android.application'

def packageJsonFile = file('../../package.json')
def packageJsonText = packageJsonFile.text
def versionMatcher = packageJsonText =~ /"version"\s*:\s*"([^"]+)"/
def appVersionName = versionMatcher ? versionMatcher[0][1] : "1.0.0"
// 两段版本号(如 "1.32")缺段按 0 补,直接取下标会越界
def versionParts = appVersionName.split('\\.')
def versionPart = { int i -> i < versionParts.length ? versionParts[i].toInteger() : 0 }
def appVersionCode = versionPart(0) * 10000 + versionPart(1) * 100 + versionPart(2)

// 签名读仓库内 keystore.properties(storeFile / keyAlias / 口令)+ release.keystore:随仓库分发是仓库所有者的既定选择,CI 无 Secret
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def localPropsFile = rootProject.file('keystore.local.properties')
def localProps = new Properties()
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
// 口令优先级:环境变量 > keystore.local.properties(不入库) > keystore.properties
// 空串按未设处理:CI 把没配的 Secret 注入成 "" 时,不能盖掉文件里的口令
def pick = { String key, String envName, props, local ->
    def v = System.getenv(envName)
    if (v != null && v.length() > 0) return v
    if (local != null && local[key]) return local[key].toString()
    if (props != null && props[key]) return props[key].toString()
    return null
}
def signStorePassword = pick('storePassword', 'KEYSTORE_STORE_PASSWORD', keystoreProps, localProps)
def signKeyPassword = pick('keyPassword', 'KEYSTORE_KEY_PASSWORD', keystoreProps, localProps)
// 口令不齐直接失败:未签名 APK 手机装不上,却能一路绿到发布页
def signingAvailable = signStorePassword != null && signStorePassword.length() > 0 && signKeyPassword != null && signKeyPassword.length() > 0 && keystorePropsFile.exists()
if (!signingAvailable) {
    throw new GradleException("签名口令缺失:检查 android/keystore.properties 的 storePassword / keyPassword(或环境变量 KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_PASSWORD)")
}

android {
    namespace = "com.games.wenzi.yunyin"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (signingAvailable) {
                keyAlias keystoreProps['keyAlias']
                keyPassword signKeyPassword
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword signStorePassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    defaultConfig {
        applicationId "com.games.wenzi.yunyin"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // 在默认值上改过以适配现代 web 应用;默认值:https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (signingAvailable) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingAvailable) signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "yunyin-${variant.versionName}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
